name: Test
on:
  push:
    # Release branches are tested by the Release workflow before publishing
    branches-ignore: [ main, beta, prerelease ]
# The specs run against a live organization: never run two pushes of the same
# branch at once (a newer pending run replaces an older pending one)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm ts:check
      - name: Build package
        run: pnpm build
      - name: Run specs
        env:
          CL_SDK_ORGANIZATION: sdk-test-org
          CL_SDK_CLIENT_ID: ${{secrets.CL_SDK_CLIENT_ID}}
          CL_SDK_CLIENT_SECRET: ${{secrets.CL_SDK_CLIENT_SECRET}}
          WEBHOOK_SECRET_CUSTOMER_CREATE: e4f274c9a36610abb209c4ffa0baa839
        run: pnpm test
